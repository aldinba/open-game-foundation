name: Foundation bug
description: Report a problem in a template, schema or workflow.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is incorrect or misleading?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Project context
      description: Runtime/engine and how you adopted the foundation.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
